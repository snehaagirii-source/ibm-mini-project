{% extends "base.html" %}


{% block title %}
Admin Login — LocalFix
{% endblock %}


{% block content %}

<section class="admin-auth-section">


    <div class="admin-auth-card">


        <div class="admin-lock-icon">
            ◆
        </div>


        <span class="section-label">
            LOCALFIX ADMIN
        </span>


        <h1>
            Control center.
        </h1>


        <p>
            Manage service providers and booking
            requests from one place.
        </p>


        <form
            method="POST"
            class="auth-form"
        >


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        ◉
                    </span>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Admin username"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        •
                    </span>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Admin password"
                        required
                    >

                </div>

            </div>


            <button
                type="submit"
                class="btn btn-primary btn-large full-width"
            >

                Enter Dashboard

                <span>
                    →
                </span>

            </button>


        </form>


        <div class="admin-login-note">

            <span>
                !
            </span>

            <p>
                Admin access is restricted.
            </p>

        </div>

    </div>

</section>

{% endblock %}
